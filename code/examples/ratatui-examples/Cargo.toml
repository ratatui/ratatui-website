[package]
name = "ratatui-examples"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
edition = "2024"
rust-version.workspace = true
publish.workspace = true

[features]
default = ["crossterm"]
crossterm = ["ratatui/crossterm"]
termina = ["ratatui/termina"]
termion = ["dep:termion", "ratatui/termion"]
termwiz = ["dep:termwiz", "ratatui/termwiz"]
unstable-widget-ref = ["ratatui/unstable-widget-ref"]

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.2", features = ["all-widgets", "layout-cache"] }
termion = { version = "4", optional = true }
termwiz = { version = "0.23", optional = true }

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6.2"
fakeit = "1.1"
futures = "0.3.31"
indoc = "2"
itertools = "0.14"
octocrab = "0.53"
palette = "0.7.6"
rand = "0.10"
rand_chacha = "0.10"
strum = { version = "0.28", features = ["derive"] }
time = { version = "0.3.47", features = ["local-offset"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tokio-stream = "0.1"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
unicode-width = "0.2.2"

[[example]]
name = "widget_impl"
required-features = ["unstable-widget-ref"]
