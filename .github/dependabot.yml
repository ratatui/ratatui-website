# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # 0.25.0 fails to build on Node 24, and the fixed 0.25.1 release is not on npm:
      # https://github.com/tree-sitter/node-tree-sitter/issues/268
      # https://github.com/tree-sitter/node-tree-sitter/issues/276
      - dependency-name: "tree-sitter"
        versions: ["0.25.0"]
      # TypeScript 7 is not yet supported by Astro's language tooling:
      # https://github.com/withastro/astro/issues/17268
      - dependency-name: "typescript"
        versions: ["7.x"]
    groups:
      js-dependencies:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns: ["*"]
